services:
  - type: web
    name: perishable-dashboard
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /_stcore/health
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: streamlit run app/streamlit_app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true --server.enableCORS=false
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
