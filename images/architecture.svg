<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system, Segoe UI, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="phase1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </linearGradient>
    <linearGradient id="phase2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#DCFCE7"/>
      <stop offset="100%" stop-color="#BBF7D0"/>
    </linearGradient>
    <linearGradient id="phase3" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#FEE2E2"/>
      <stop offset="100%" stop-color="#FECACA"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Title -->
  <text x="640" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">
    Perishable Inventory &amp; Supply Chain Platform — End-to-End Architecture
  </text>
  <text x="640" y="74" text-anchor="middle" font-size="14" fill="#475569">
    Raw CSV → Normalised OLTP → dbt Star Schema → Live BI Dashboard
  </text>

  <!-- Phase 1 lane -->
  <rect x="30" y="110" width="370" height="540" rx="14" fill="url(#phase1)" stroke="#3B82F6" stroke-width="2"/>
  <text x="215" y="142" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A8A">
    Phase 1 · Ingest &amp; Model
  </text>

  <!-- Phase 1 boxes -->
  <g filter="url(#shadow)">
    <rect x="65" y="170" width="300" height="60" rx="10" fill="#FFFFFF" stroke="#3B82F6"/>
    <text x="215" y="200" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">📄 perishable_goods_management.csv</text>
    <text x="215" y="218" text-anchor="middle" font-size="11" fill="#64748B">~21 MB · 42 columns · raw transactional</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="65" y="260" width="300" height="70" rx="10" fill="#FFFFFF" stroke="#3B82F6"/>
    <text x="215" y="288" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">🐍 ingest_data.py (Pandas + SQLAlchemy)</text>
    <text x="215" y="306" text-anchor="middle" font-size="11" fill="#64748B">Clean • Validate • Bucket • Stage</text>
    <text x="215" y="322" text-anchor="middle" font-size="11" fill="#64748B">Idempotent · ON CONFLICT DO NOTHING</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="65" y="360" width="300" height="110" rx="10" fill="#FFFFFF" stroke="#3B82F6"/>
    <text x="215" y="386" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">🗄️ Neon Postgres — OLTP (3NF)</text>
    <text x="215" y="406" text-anchor="middle" font-size="11" fill="#64748B">regions · categories · stores · suppliers</text>
    <text x="215" y="422" text-anchor="middle" font-size="11" fill="#64748B">products · promotions · product_promotions</text>
    <text x="215" y="438" text-anchor="middle" font-size="11" fill="#64748B">inventory_transactions</text>
    <text x="215" y="458" text-anchor="middle" font-size="11" font-style="italic" fill="#1E3A8A">PK/FK/CHECK constraints · indexes · triggers</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="65" y="500" width="300" height="60" rx="10" fill="#FFFFFF" stroke="#3B82F6"/>
    <text x="215" y="528" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">🔐 security.sql — RBAC</text>
    <text x="215" y="546" text-anchor="middle" font-size="11" fill="#64748B">analyst (SELECT) · app_user (SELECT/INSERT/UPDATE)</text>
  </g>

  <!-- Phase 2 lane -->
  <rect x="430" y="110" width="370" height="540" rx="14" fill="url(#phase2)" stroke="#10B981" stroke-width="2"/>
  <text x="615" y="142" text-anchor="middle" font-size="18" font-weight="700" fill="#065F46">
    Phase 2 · Transform &amp; Test
  </text>

  <g filter="url(#shadow)">
    <rect x="465" y="170" width="300" height="100" rx="10" fill="#FFFFFF" stroke="#10B981"/>
    <text x="615" y="196" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">🧪 dbt Core — Star Schema</text>
    <text x="615" y="216" text-anchor="middle" font-size="11" fill="#64748B">dim_product · dim_store · dim_supplier</text>
    <text x="615" y="232" text-anchor="middle" font-size="11" fill="#64748B">fact_inventory (central fact)</text>
    <text x="615" y="252" text-anchor="middle" font-size="11" font-style="italic" fill="#065F46">dbt run · dbt test · dbt docs generate</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="465" y="300" width="300" height="90" rx="10" fill="#FFFFFF" stroke="#10B981"/>
    <text x="615" y="326" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">✅ Data quality &amp; performance</text>
    <text x="615" y="346" text-anchor="middle" font-size="11" fill="#64748B">not_null · unique · relationships tests</text>
    <text x="615" y="362" text-anchor="middle" font-size="11" fill="#64748B">EXPLAIN ANALYZE + composite indexes</text>
    <text x="615" y="378" text-anchor="middle" font-size="11" font-style="italic" fill="#065F46">~850 ms → ~140 ms (~6× faster)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="465" y="420" width="300" height="90" rx="10" fill="#FFFFFF" stroke="#10B981"/>
    <text x="615" y="446" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">⚙️ GitHub Actions CI</text>
    <text x="615" y="466" text-anchor="middle" font-size="11" fill="#64748B">SQLFluff lint + dbt test on every PR</text>
    <text x="615" y="482" text-anchor="middle" font-size="11" fill="#64748B">Secrets injected from GitHub → ~/.dbt/profiles.yml</text>
    <text x="615" y="498" text-anchor="middle" font-size="11" font-style="italic" fill="#065F46">.github/workflows/ci.yml</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="465" y="540" width="300" height="60" rx="10" fill="#FFFFFF" stroke="#10B981"/>
    <text x="615" y="568" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">📊 3 Advanced analytical queries</text>
    <text x="615" y="586" text-anchor="middle" font-size="11" fill="#64748B">CTEs · window functions · moving averages</text>
  </g>

  <!-- Phase 3 lane -->
  <rect x="830" y="110" width="420" height="540" rx="14" fill="url(#phase3)" stroke="#EF4444" stroke-width="2"/>
  <text x="1040" y="142" text-anchor="middle" font-size="18" font-weight="700" fill="#7F1D1D">
    Phase 3 · Application &amp; Deploy
  </text>

  <g filter="url(#shadow)">
    <rect x="860" y="170" width="360" height="100" rx="10" fill="#FFFFFF" stroke="#EF4444"/>
    <text x="1040" y="196" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">🥬 Streamlit BI Dashboard (7 pages)</text>
    <text x="1040" y="214" text-anchor="middle" font-size="11" fill="#64748B">Overview · Products · Suppliers · Regions</text>
    <text x="1040" y="230" text-anchor="middle" font-size="11" fill="#64748B">Waste · Promotions · Data Explorer</text>
    <text x="1040" y="250" text-anchor="middle" font-size="11" font-style="italic" fill="#7F1D1D">Plotly · @st.cache_data · @st.cache_resource</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="860" y="300" width="360" height="90" rx="10" fill="#FFFFFF" stroke="#EF4444"/>
    <text x="1040" y="326" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">🔌 Pooled SQLAlchemy access (db.py)</text>
    <text x="1040" y="346" text-anchor="middle" font-size="11" fill="#64748B">QueuePool: size=5, overflow=5, recycle=300s</text>
    <text x="1040" y="362" text-anchor="middle" font-size="11" fill="#64748B">pool_pre_ping=True · sslmode=require</text>
    <text x="1040" y="378" text-anchor="middle" font-size="11" font-style="italic" fill="#7F1D1D">DATABASE_URL from env — never hardcoded</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="860" y="420" width="360" height="90" rx="10" fill="#FFFFFF" stroke="#EF4444"/>
    <text x="1040" y="446" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">☁️ Render — auto-deploy on push</text>
    <text x="1040" y="466" text-anchor="middle" font-size="11" fill="#64748B">render.yaml blueprint · /_stcore/health check</text>
    <text x="1040" y="482" text-anchor="middle" font-size="11" fill="#64748B">Secrets in dashboard, not in repo</text>
    <text x="1040" y="498" text-anchor="middle" font-size="11" font-style="italic" fill="#7F1D1D">.github/workflows/streamlit-app.yml</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="860" y="540" width="360" height="60" rx="10" fill="#FFFFFF" stroke="#EF4444"/>
    <text x="1040" y="568" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">🌐 Public URL → end user</text>
    <text x="1040" y="586" text-anchor="middle" font-size="11" fill="#64748B">https://&lt;your-service&gt;.onrender.com</text>
  </g>

  <!-- Arrows between lanes -->
  <line x1="365" y1="395" x2="465" y2="395" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="765" y1="220" x2="860" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="765" y1="345" x2="860" y2="345" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- footer -->
  <text x="640" y="690" text-anchor="middle" font-size="11" fill="#64748B">
    EAS 550 · Team 9 · Perishable Inventory and Supply Chain Platform
  </text>
</svg>
