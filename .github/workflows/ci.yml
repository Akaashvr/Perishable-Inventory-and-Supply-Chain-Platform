name: dbt CI Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  dbt-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install "dbt-postgres==1.10.0"
          pip install "sqlfluff==3.0.7"
          pip install "sqlfluff-templater-dbt==3.0.7"

      - name: Create dbt profile
        run: |
          mkdir -p ~/.dbt
          echo "
          dbt_project:
            target: dev
            outputs:
              dev:
                type: postgres
                host: ${{ secrets.DB_HOST }}
                user: ${{ secrets.DB_USER }}
                password: ${{ secrets.DB_PASSWORD }}
                port: ${{ secrets.DB_PORT }}
                dbname: ${{ secrets.DB_NAME }}
                schema: public
                threads: 1
                sslmode: require
          " > ~/.dbt/profiles.yml

      - name: Clear SQLFluff cache
        run: rm -rf ~/.cache/sqlfluff || true
        
      - name: Lint SQL with SQLFluff
        run: sqlfluff lint dbt_project/models dbt_project/analyses

      - name: Install dbt packages
        run: dbt deps
        working-directory: dbt_project

      - name: Run dbt models
        run: dbt run
        working-directory: dbt_project

      - name: Run dbt tests
        run: dbt test
        working-directory: dbt_project